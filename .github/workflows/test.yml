name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege — no job needs more than read access to the repo contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Migrations auto-apply via MemoryStore.create in the test harness.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asb_test

  # Red builds never reach the server — deploy only runs on green pushes to main.
  # `environment: production` lets the operator attach required reviewers in
  # repo settings so a push alone can't ship without approval.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Pinned to the v0.9.0 tag's commit — third-party actions referenced by
      # mutable tags are a supply-chain risk.
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}
      # Pinned host key instead of accept-new: a MITM on first contact can no
      # longer substitute their own key. ORACLE_HOST_KEY is the output of
      # `ssh-keyscan` against the deploy host — if it's unset the strict check
      # fails closed and the deploy cannot run. The host itself lives in
      # ORACLE_SSH_HOST (user@ip) so the prod address isn't committed to the
      # repo.
      - name: Trust the deployment host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.ORACLE_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      # `npm ci` between pull and restart is load-bearing: a merged PR that
      # adds a dependency would otherwise crash prod on restart with a missing
      # module. Full install (not --omit=dev) because `npm start` currently
      # runs through tsx, which lives in devDependencies — tighten this to
      # `npm ci --omit=dev && npm run build` once the tsc build path lands.
      - name: Pull, install, and restart on Oracle
        run: >-
          ssh -o StrictHostKeyChecking=yes ${{ secrets.ORACLE_SSH_HOST }}
          "cd ~/ASB && git pull --ff-only && npm ci && pm2 restart asb --update-env"
